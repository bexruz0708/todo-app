{% extends "base.html" %}

{% block content %}
<div class="container mt-5" style="max-width:400px;">
    <h3 class="mb-3">Register</h3>

   <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
      <button type="submit" class="btn btn-success w-100">Register</button>
   </form>

   {% if form.errors %}
   <div class="alert alert-danger mt-3">
    Please correct the errors
   </div>

   {% endif %}

{}
</div>
{% endblock %}
